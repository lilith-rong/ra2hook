; ra2hook.ini — 放到 <游戏目录>\ra2hook\ra2hook.ini
; 旧的 <游戏目录>\ra2hook.ini 仍可兼容读取，但新路径优先。
;
; 全部默认关闭。不放这个文件 = 什么都不做。

[Dump]
; 总开关。dump 会拖慢启动并占用磁盘，平时建议关闭，需要导出时才开。
Enabled=yes

; 分类开关（需 Enabled=yes 才起作用）
INI=yes
CSF=yes
VXL=no
SHP=no

; VXL/SHP 是否按 art 注册名归类到子文件夹（如 vxl/HTNK/HTNK.VXL）。
; 关闭则全部平铺到 vxl/ 和 shp/ 下。
SortByOwner=yes

; 只导出指定单位的 VXL/SHP，逗号分隔的注册名（ID）。留空 = 全部导出。
; 只影响 VXL/SHP，不影响 INI/CSF。
; 用法建议：先全量 dump 一次拿到 rulesmd.ini/artmd.ini，从里面查到想要的
; 单位 ID，再填到这里做精确导出，避免每次都跑几千个单位。
; 例：OnlyUnits=HTNK,MTNK,GI
OnlyUnits=

; 导出 INI 时剔除首部的 [#include] 段。
; 建议保持开启：dump 出来的文件里 include 内容已经全部合并进来，[#include]
; 只是历史记录。若关闭并把 dump 当作 mod 的 rules 使用，Ares 会再次加载那
; 几百个 include 文件（重复合并；文件缺失则报错）。
StripInclude=yes

[Inject]
; set 写入与 remove 显式键删除在启动阶段依次执行。
; Enabled 名称保留，是启动 set 覆盖 + remove 删除两阶段的总开关。
; 独立于 Ares/Phobos 的 [#include]，每个目标由 set 下的子目录指定。
; 迁移：手动把 inject\enabled 移动/改名为 inject\set，保留目标子目录；
; 不会自动加载旧 enabled。编辑启动层或修改开关后须完整重启游戏。
Enabled=no

;   ra2hook\inject\set\rules\*.ini   -> 并进 rules（按文件名排序）
;   ra2hook\inject\set\ra2md\*.ini   -> 并进 ra2md（按文件名排序）
;   ra2hook\inject\set\art\*.ini     -> 并进 art（按文件名排序）
;   ra2hook\inject\set\ai\*.ini      -> 并进 ai（独立挂点）
;   ra2hook\inject\set\uimd\*.ini    -> 并进引擎全局 UIMD 对象（有限制）
;   ra2hook\inject\set\sound\*.ini   -> 两阶段预备后并进 SOUNDMD 局部对象（实验性）
; 每个 set 目标目录内的文件按名称排序，后写覆盖前写。
; 注入文件可以有自己的 [#include] 段。ra2hook 会独立展开它，不会干扰
; Ares/Phobos 原本的 [#include] 链，也不会把 inject 的 [#include] 段写进目标 INI。
; 展开顺序：先并入当前文件，再按 [#include] 键顺序深度优先并入引用文件，后写覆盖。
; 引用路径优先按当前文件所在目录解析，找不到再按 RA2/引擎文件系统解析；
; 因此可以引用 ra2hook\inject\mix\*.mix 中已注册的 INI。
;
; 例：ra2hook\inject\set\rules\index.ini
; [#include]
; 1=extra_units.ini
; 2=balance_patch.ini
;
; remove 首版仅 ra2hook\inject\remove\rules\*.ini，目标仅 INI_Rules 显式键。
; 全部主 set rules/ra2md/art 及其 include 后，RegisterInjectedTypes、
; ReloadInjectedGlobalRules 和原生类型读取前执行；不支持其他 remove 目标。
; 独立严格命令解析，绝不作为普通游戏 INI 解析/复制。示例（仅注释，不会执行）：
; [UNIT_ID]
; -=Prerequisite
; -=FactoryOwners
; -=ForbiddenHouses
; 重复 -= 行保留；段/键不区分大小写精确匹配，不存在跳过，重复删除无害。
; remove 的 [#include] 支持 +=path 和命名/编号 key=path，禁止 -；
; 正文先于子 include，子路径先当前文件再游戏/MIX。片段应放入口 rules 目录外。
; 所有根文件及 include 必须全部读取/解析成功后才删除；缺失子文件、坏语法
; （正文 +=、Foo=no、空 -= 等）、循环、深度 >32 或资源超限拒绝整个 remove 层，
; 已完成 set 保留；remove 目录不存在是无操作。完整规则见 REMOVE_INI.md。
; 禁止通配符、整段删除和注册表/列表段，不注销类型；不写 no/空值，不恢复旧层值，
; 不修改默认值或缓存的 TypeClass。Dump 键缺失仅证明显式删除，不保证解除生产限制。

; 把 ra2hook\inject\mix\ 下全部 .mix 文件注册进引擎（MixFileClass）。
; mix 里可以放你自己单位的 SHP/VXL/PCX 等资源——这些只能按文件名被引擎引用，
; 和 INI 注入无关，做成 mix 是正确做法。文件名无约定，目录下所有 .mix 都会装载。
Mix=yes

[Runtime]
; 运行时热重载仅允许战役/遭遇战。局域网、互联网和录像会被硬阻止；
; 离开单机对局时，类型字段回滚到本局首次修改前的实时基线；全局 Rules 段
; 回滚到 INI_Rules 基线。两者边界见 RUNTIME_INI.md。
; 修改此总开关后必须重启游戏。UI 中每个补丁还可以独立启用或停用。
Enabled=no

; 监视 Directory 下的 *.ini。保存稳定后自动构建完整目标状态并应用。
AutoApply=yes
Directory=ra2hook\runtime
DebounceMs=500

[Log]
; 0=off 1=error 2=warn 3=info 4=debug
Level=3
