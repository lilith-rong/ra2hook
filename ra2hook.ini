; ra2hook.ini — 放到 RA2 根目录（与 gamemd.exe 同级）
;
; 全部默认关闭。不放这个文件 = 什么都不做。

[Dump]
; 总开关。dump 会拖慢启动并占用磁盘，平时建议关闭，需要导出时才开。
Enabled=yes

; 分类开关（需 Enabled=yes 才起作用）
INI=yes
CSF=yes
VXL=no
SHP=no

; VXL/SHP 是否按 art 注册名归类到子文件夹（如 vxl/HTNK/HTNK.VXL）。
; 关闭则全部平铺到 vxl/ 和 shp/ 下。
SortByOwner=yes

; 只导出指定单位的 VXL/SHP，逗号分隔的注册名（ID）。留空 = 全部导出。
; 只影响 VXL/SHP，不影响 INI/CSF。
; 用法建议：先全量 dump 一次拿到 rulesmd.ini/artmd.ini，从里面查到想要的
; 单位 ID，再填到这里做精确导出，避免每次都跑几千个单位。
; 例：OnlyUnits=HTNK,MTNK,GI
OnlyUnits=

; 导出 INI 时剔除首部的 [#include] 段。
; 建议保持开启：dump 出来的文件里 include 内容已经全部合并进来，[#include]
; 只是历史记录。若关闭并把 dump 当作 mod 的 rules 使用，Ares 会再次加载那
; 几百个 include 文件（重复合并；文件缺失则报错）。
StripInclude=yes

[Inject]
; 把额外 rules 并进游戏，独立于 Ares/Phobos 的 [#include]——在它们的 include
; 全部处理完之后才注入，且不参与它们的包含链。语义：后写胜出，覆盖既有键。
Enabled=no

; 注入来源，二选一：
;   1) Files= 显式列出要注入的 ini（逗号分隔，顺序即注入顺序，后者覆盖前者）。
;      路径相对 RA2 根目录，如 ra2hook/inject/extra_units.ini。
;      显式列表只作用于 rules 目标。
;   2) 留空则按目标目录自动注入（推荐）：
;      ra2hook\inject\enabled\rules\*.ini   -> 并进 rules
;      ra2hook\inject\enabled\ra2md\*.ini   -> 并进 ra2md
;      ra2hook\inject\enabled\art\*.ini    （挂点未定，暂不注入）
;      ra2hook\inject\enabled\ai\*.ini     （挂点未定，暂不注入）
;      ra2hook\inject\enabled\uimd\*.ini   （挂点未定，暂不注入）
; 注入文件可以有自己的 [#include] 段。ra2hook 会独立展开它，不会干扰
; Ares/Phobos 原本的 [#include] 链，也不会把 inject 的 [#include] 段写进目标 INI。
; 展开顺序：先并入当前文件，再按 [#include] 键顺序深度优先并入引用文件，后写覆盖。
; 引用路径优先按当前文件所在目录解析，找不到再按 RA2/引擎文件系统解析；
; 因此可以引用 ra2hook\inject\mix\*.mix 中已注册的 INI。
;
; 例：ra2hook\inject\enabled\rules\index.ini
; [#include]
; 1=extra_units.ini
; 2=balance_patch.ini
Files=

; 把 ra2hook\inject\mix\ 下全部 .mix 文件注册进引擎（MixFileClass）。
; mix 里可以放你自己单位的 SHP/VXL/PCX 等资源——这些只能按文件名被引擎引用，
; 和 INI 注入无关，做成 mix 是正确做法。文件名无约定，目录下所有 .mix 都会装载。
Mix=yes

[Log]
; 0=off 1=error 2=warn 3=info 4=debug
Level=3
