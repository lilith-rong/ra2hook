; ra2hook.ini — 放到 <游戏目录>\ra2hook\ra2hook.ini
; 旧的 <游戏目录>\ra2hook.ini 仍可兼容读取，但新路径优先。
;
; 成品默认关闭全部开关和日志，需要时手动开启相应总开关与子项。
; 不放配置文件时，Dump/Inject/Runtime 也不会启用。

[Dump]
; 总开关。dump 会拖慢启动并占用磁盘，需要导出时改为 yes，并开启所需子项。
Enabled=no

; 分类开关（需 Enabled=yes 才起作用）
INI=no
CSF=no
VXL=no
SHP=no

; VXL/SHP 是否按 art 注册名归类到子文件夹（如 vxl/HTNK/HTNK.VXL）。
; 关闭则全部平铺到 vxl/ 和 shp/ 下。
SortByOwner=no

; 只导出指定单位的 VXL/SHP，逗号分隔的注册名（ID）。留空 = 全部导出。
; 只影响 VXL/SHP，不影响 INI/CSF。
; 用法建议：先全量 dump 一次拿到 rulesmd.ini/artmd.ini，从里面查到想要的
; 单位 ID，再填到这里做精确导出，避免每次都跑几千个单位。
; 例：OnlyUnits=HTNK,MTNK,GI
OnlyUnits=

; 导出 INI 时剔除首部的 [#include] 段。
; 启用 INI 导出时建议同时开启：dump 中 include 内容已全部合并，原段只是历史记录。
; 若不剔除并把 dump 当作 mod rules 使用，Ares 可能再次展开这些 include。
StripInclude=no

[Inject]
; 统一启动补丁：普通赋值、+=追加、-=删除按文件/行顺序交错执行，后出现者优先。
; Enabled 名称不变，目标由 inject 下的六种目录决定；仅 rules 支持 -=。
; 旧 enabled/set/remove 不自动加载，需迁移并复核 include 路径及执行顺序。
; 修改启动文件或此开关后须完整重启游戏。
Enabled=no

;   ra2hook\inject\rules\*.ini -> INI_Rules
;   ra2hook\inject\art\*.ini   -> INI_Art
;   ra2hook\inject\ra2md\*.ini -> INI_RA2MD
;   ra2hook\inject\ai\*.ini    -> INI_AI（独立挂点）
;   ra2hook\inject\uimd\*.ini  -> 引擎全局 UIMD（扩展局部对象有限制）
;   ra2hook\inject\sound\*.ini -> 预解析计划后在安全挂点应用（需专项验证）
; 根文件按文件名不区分大小写排序；每文件逐行，include 在出现处深度优先展开，
; 子文件完成后继续父文件。私有 [#include] 不写入目标、不干扰 Ares/Phobos 原链。
; 相对路径先当前文件目录，再游戏目录/引擎/MIX。片段放入口目录外，避免重复扫描。
; [#include] 接受 +=path 或 name=path，不允许 -=path。
;
; 同一 rules 文件示例（注释，不会执行）：
; [UNIT_ID]
; Strength=800
; -=Prerequisite
; Prerequisite=GAWEAP
; -=FactoryOwners
; 最终 Prerequisite 为 GAWEAP（后出现的赋值恢复前面删除的键）。
; +=Value 在普通段内生成独立 RA2Hook_N 追加项，不是算术或属性值列表拼接。
; + 和 - 是特殊指令，重复行不会折叠成普通 INI 的同名键。
;
; 每个目标全部根文件/include 必须读取、解析成功后才做任何变更；缺失文件、坏语法、
; 循环、深度 >32 或资源超限时，该目标赋值/追加/删除全部不执行，其他目标独立。
; 原生执行失败停止剩余指令，不承诺回滚。空目录是合法无操作。
; 删除精确匹配段/键且大小写不敏感；缺失跳过，禁止通配符、整段/注册表成员删除。
; 注册表仍可赋值/追加；不注销单位，不改默认值/缓存，不写 no/空值或恢复旧层。
; Dump 缺失只证明显式删除，不保证玩法限制解除。详见 INJECT_INI.md、REMOVE_INI.md。

; 把 ra2hook\inject\mix\ 下全部 .mix 文件注册进引擎（MixFileClass）。
; mix 里可以放你自己单位的 SHP/VXL/PCX 等资源——这些只能按文件名被引擎引用，
; 和 INI 注入无关，做成 mix 是正确做法。文件名无约定，目录下所有 .mix 都会装载。
Mix=no

[Runtime]
; 运行时热重载仅允许战役/遭遇战。局域网、互联网和录像会被硬阻止；
; 离开单机对局时，类型字段回滚到本局首次修改前的实时基线；全局 Rules 段
; 回滚到 INI_Rules 基线。两者边界见 RUNTIME_INI.md。
; 修改此总开关后必须重启游戏。UI 中每个补丁还可以独立启用或停用。
Enabled=no

; 需要监视 Directory 下的 *.ini 并在保存稳定后自动应用时，再手动开启。
AutoApply=no
Directory=ra2hook\runtime
DebounceMs=500

[Log]
; 0=off 1=error 2=warn 3=info 4=debug；排查问题时手动改为 3 或 4。
Level=0
