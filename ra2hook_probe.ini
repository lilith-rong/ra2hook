; ra2hook_probe.ini — [#include] 可见性探针（验证用，可随时删）
;
; 用法：
;   1. 把本文件放到 RA2 根目录（与 gamemd.exe 同级）
;   2. 在 rulesmd.ini 里引用它：
;
;        [#include]
;        1=ra2hook_probe.ini
;
;      注意：若 rulesmd.ini 已有 [#include] 段，不要新增第二个（重复段名会
;      覆盖，破坏 mod 原有包含链）。应在已有段里追加一个未占用的编号，如 3=。
;
; 若 ra2hook.log 里 FromAresInclude=[1]，说明 0x679A15 能看到 Ares include 的内容。

[RA2HookProbe]
FromAresInclude=1
