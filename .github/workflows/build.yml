name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

env:
  # 构建配置。可改为 Debug / DevBuild / Release。
  BUILD_CONFIGURATION: Release
  # 解决方案文件相对仓库根的路径。
  SOLUTION_FILE_PATH: ra2hook.sln

jobs:
  build:
    runs-on: windows-latest

    steps:
    # YRpp 是 submodule，recursive 不能漏，否则一堆缺头文件。
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # windows-latest 自带 v143 工具集与 Windows 10 SDK，满足 DEVELOPMENT.md §2.3。
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '[16.0, )'

    # 让编译错误在 PR diff 里高亮。
    - uses: ammaraskar/msvc-problem-matcher@master

    - name: Set up .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore runtime UI
      run: dotnet restore ui/RA2Hook.RuntimeUI.csproj

    - name: Configure removal tests
      run: cmake -S tests -B removal-tests -A Win32

    - name: Build removal tests
      run: cmake --build removal-tests --config Release

    - name: Run removal tests
      run: ctest --test-dir removal-tests -C Release --output-on-failure

    - name: Build
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=x86 /p:GitCommit=${{ github.sha }} /p:GitBranch=${{ github.ref_name }} ${{ env.SOLUTION_FILE_PATH }}
      shell: cmd

    - name: Publish runtime UI
      run: dotnet publish ui/RA2Hook.RuntimeUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "${{ env.BUILD_CONFIGURATION }}/ra2hook"

    - name: Stage configuration and empty inject directories
      shell: pwsh
      run: |
        $packageRoot = Join-Path $env:BUILD_CONFIGURATION 'ra2hook'
        New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
        Copy-Item -LiteralPath ra2hook.ini -Destination (Join-Path $packageRoot 'ra2hook.ini') -Force
        Copy-Item -LiteralPath REMOVE_INI.md -Destination (Join-Path $packageRoot 'REMOVE_INI.md') -Force

        # Generate the supported layout, never copy the repository's user INIs/MIXes.
        # Only remove generated staging content, not the source inject directory.
        $injectRoot = Join-Path $packageRoot 'inject'
        if (Test-Path -LiteralPath $injectRoot) {
          Remove-Item -LiteralPath $injectRoot -Recurse -Force
        }
        $directories = @(
          'set/rules'
          'set/art'
          'set/ra2md'
          'set/ai'
          'set/uimd'
          'set/sound'
          'remove/rules'
          'mix'
        )
        foreach ($relative in $directories) {
          $directory = Join-Path $injectRoot $relative
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          # upload-artifact skips truly empty directories. A zero-byte marker
          # preserves each directory in the downloaded ZIP without active rules.
          New-Item -ItemType File -Path (Join-Path $directory '.gitkeep') -Force | Out-Null
        }
        $unexpectedFiles = @(Get-ChildItem -LiteralPath $injectRoot -File -Recurse -Force |
          Where-Object { $_.Name -ne '.gitkeep' -or $_.Length -ne 0 })
        if ($unexpectedFiles.Count -ne 0) {
          throw 'The packaged inject tree must contain only empty .gitkeep files.'
        }

    - name: Upload artifact
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: ra2hook-${{ github.sha }}
        path: |
          ${{ env.BUILD_CONFIGURATION }}/ra2hook.dll
          ${{ env.BUILD_CONFIGURATION }}/ra2hook.pdb
          ${{ env.BUILD_CONFIGURATION }}/ra2hook/**
        if-no-files-found: error
        # Keep generated markers so every supported set/remove directory ships.
        include-hidden-files: true
